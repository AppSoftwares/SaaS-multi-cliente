name: Build & Release (APK/IPA)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión de la release (ej. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-android:
    name: Build Android (APK / AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android App
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks
            echo "Building signed Release APK & AAB..."
            ./gradlew assembleRelease bundleRelease
          else
            echo "Keystore secret not provided. Building Debug APK for validation..."
            ./gradlew assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: |
            android/app/build/outputs/apk/**/*.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-aab
          path: |
            android/app/build/outputs/bundle/**/*.aab

  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS App
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          KC_PASS: ${{ secrets.KEYCHAIN_PASSWORD || 'buildpassword123' }}
        run: |
          if [ -n "$P12_BASE64" ]; then
            echo "iOS signing secrets found. Setting up signing..."
            echo "$P12_BASE64" | base64 --decode > cert.p12
            echo "$PROFILE_BASE64" | base64 --decode > app.mobileprovision
            security create-keychain -p "$KC_PASS" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "$KC_PASS" build.keychain
            security import cert.p12 -k build.keychain -P "$P12_PASS" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" build.keychain
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            UUID=$(grep -a -A1 UUID app.mobileprovision | grep -io "[0-9a-f-]\{36\}" | head -1)
            cp app.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

            cat << EOF > ios/ExportOptions.plist
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>method</key>
                <string>app-store</string>
                <key>signingStyle</key>
                <string>manual</string>
                <key>stripSwiftSymbols</key>
                <true/>
                <key>teamID</key>
                <string>$TEAM_ID</string>
                <key>uploadSymbols</key>
                <true/>
            </dict>
            </plist>
            EOF

            xcodebuild -project ios/App/App.xcodeproj -scheme App \
              -configuration Release -archivePath $PWD/build/App.xcarchive \
              archive CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="$TEAM_ID"

            xcodebuild -exportArchive -archivePath build/App.xcarchive \
              -exportOptionsPlist ios/ExportOptions.plist -exportPath build/ipa
          else
            echo "⚠️ iOS signing secrets not provided. Performing test build (Code Signing disabled)."
            xcodebuild -project ios/App/App.xcodeproj -scheme App \
              -configuration Release -sdk iphonesimulator \
              CODE_SIGNING_ALLOWED=NO -derivedDataPath build || true
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/ipa/*.ipa
